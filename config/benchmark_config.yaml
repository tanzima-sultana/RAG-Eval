# 1. What to benchmark: one build and one eval dataset, and where to save the results
inputs:
  manifest_path: outputs/pdfa-eng-wds/build/pdfa-eng-wds_100_6651906afc4a.json                         # The build manifest; every chunk type and index it lists is benchmarked
  eval_dataset_metadata_path: outputs/pdfa-eng-wds/eval_dataset/eval_dataset_5f74faf08fdb_metadata.json   # The eval dataset metadata; the eval set it names is used
  output_path: outputs/                                                                           # Root output folder

# 2. Query transformation
query:
  n_multi_qus: 3                                    # Phrasings the query LLM writes for each eval question
  query_types: [original, rewritten, multi, hyde]             # Extra query types: any of rewritten, multi, hyde. Original is always made; [] for original only
  query_split: false                                 # true to split the queries into val and test, false to use all of them as both
  val_queries_size: 150                             # Used only with query_split true: queries for retrieval and retrieval evaluation
  test_queries_size: 50                             # Used only with query_split true: queries for answer generation and answer evaluation

# 3. The query LLM
query_llm:
  model: ollama_chat/llama3.1:8b  
  max_tokens: 16000           # Maximum output tokens per call
  timeout_seconds: 180        # Seconds before one call times out
  ollama_api_base: http://localhost:11434
  ollama_context_length: 32768

# 4. Retrieval: hybrid only
retrieval:
  reranking: [true, false]                                    # Reranking values to benchmark: true, false or both
  top_k: 20                                                   # Chunks the retrieval returns
  rerank_top_k: 5                                             # Chunks kept after the cross-encoder reranks the top_k chunks
  cross_encoder_model: cross-encoder/ms-marco-MiniLM-L-6-v2   # Cross-encoder that reranks, used only with reranking



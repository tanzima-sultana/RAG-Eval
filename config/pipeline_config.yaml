# The settings of the pipeline that do not depend on the setup. Everything that decides the setup's results is read
# from its record in the best setups file

# 1. Which best setup to serve, and where its caches are
inputs:
  best_setups_path: outputs/pdfa-eng-wds/best_setups/best_setups_fec52ec1befe_5f74faf08fdb_255f28f73c50.json   # The best setups file the benchmark saved
  setup_rank: 1                                      # Which setup of the file to serve: 1 for the best
  query_path: outputs/queries                        # The folder of the query LLM cache
  retrieved_path: outputs/pdfa-eng-wds/retrieved     # The folder of the retrieved results

# 2. The query LLM call settings that do not change its replies
query_llm:
  timeout_seconds: 180        # Seconds before one call times out

# 3. Ollama server, used only when the setup's query LLM is an Ollama model
ollama:
  api_base: http://localhost:11434

# 4. Qdrant server, where the build's Qdrant collections are
qdrant:
  url: http://localhost:6333

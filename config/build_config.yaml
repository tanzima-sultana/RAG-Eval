# 1. Ingestion
ingestion:
  dataset_size: 50
  dataset_name: pdfa-eng-wds
  input_path: data/pdfa-eng-wds/
  output_path: outputs/
  document_type: pdf

# 2. Embedder: the one embedding model chunking, embedding, indexing and the vector DB share
embedder:
  embedding_provider: huggingface             # one of huggingface
  model_name: all-MiniLM-L6-v2
  batch_size: 256
  normalize_embeddings: true                  # true or false

# 2. Chunking
chunking:
  chunk_types: [fixed, sentence, semantic]    # one or more of fixed, sentence, semantic
  min_chunk_size: 128
  max_chunk_size: 256
  fixed_chunk_overlap: [32, 64, 128]          # one or more overlaps, each built for every chunk type

# 4. Indexing
faiss_indexing:
  faiss_types: [faiss_flatip, faiss_ivf, faiss_hnsw]   # one or more of faiss_flatip, faiss_ivf, faiss_hnsw, bm25
  faiss_ivf:
    ivf_nlist_multiplier: [4, 8, 16]          # one or more; nlist = multiplier * sqrt(chunks), capped at chunks // 39
  faiss_hnsw:
    hnsw_m: 32
    hnsw_ef_construction: 200
  
bm25_indexing:
  bm25_k1: 1.5
  bm25_b: 0.75
  bm25_tokenizer: whitespace

# 5. Vector DB
vectordb_indexing:
  vectordb_types: [qdrant]    # one or more of qdrant
  qdrant_url: http://localhost:6333
  qdrant_batch_size: 256

# 1. Ingestion
ingestion:
  dataset_size: 15
  dataset_name: pdfa-eng-wds
  input_path: data/pdfa-eng-wds/
  output_path: outputs/
  document_type: pdf

# 2. Chunking
chunking:
  model_name: all-MiniLM-L6-v2
  chunk_types: [fixed, sentence, semantic]    # one or more of fixed, sentence, semantic
  min_chunk_size: 128
  max_chunk_size: 256
  fixed_chunk_overlap: 32
  semantic_threshold: 0.2

# 4. Indexing
indexing:
  index_types: [faiss_flatip, faiss_ivf, faiss_hnsw, bm25]   # one or more of faiss_flatip, faiss_ivf, faiss_hnsw, bm25
  ivf_nlist: 256
  hnsw_m: 32
  hnsw_ef_construction: 200
  bm25_k1: 1.5
  bm25_b: 0.75
  bm25_tokenizer: whitespace

# 5. Vector DB
vectordb:
  vectordb_types: [qdrant]    # one or more of qdrant
  qdrant_url: http://localhost:6333
  qdrant_batch_size: 256

# LLM provider: shared by every layer
llm_provider:
  llm_max_tokens: 16000           # Maximum output tokens per call
  llm_timeout_seconds: 180        # Seconds before one call times out
  ollama_api_base: http://localhost:11434   # Used only for Ollama models
  ollama_context_length: 32768    # Used only for Ollama models. Ollama's default of 4096 cuts long RAGAS prompts

# 6. Eval dataset
eval_dataset:
  eval_dataset_llm_model: anthropic/claude-sonnet-5-5     # Writes the eval questions and answers
  eval_dataset_kg_llm_model: anthropic/claude-haiku-5-5   # Builds the RAGAS knowledge graph
  eval_dataset_embedding_model: all-MiniLM-L6-v2          # Local embedding model RAGAS uses to build its knowledge graph
  n_sample_documents: 100         # Documents randomly picked for RAGAS to generate the QnA from
  n_evals_requested: 200          # QnA items to generate

# 7. Query transformation
query_transformation:
  query_llm_model: ollama_chat/llama3.1:8b   # Transforms the eval questions
  n_multi_qus: 3                             # Phrasings the query LLM writes for each eval question
  query_types: [original, rewritten, multi, hyde]   # one or more of original, rewritten, multi, hyde
  query_split: true           # true to split the queries into val and test, false to use all of them as both
  val_queries_size: 150       # Used only with query_split true: queries for retrieval and retrieval evaluation
  test_queries_size: 50       # Used only with query_split true: queries for answer generation and answer evaluation

# 8. Retrieval
retrieval:
  retrieval_types: [dense, bm25, hybrid]            # one or more of dense, bm25, hybrid
  top_k: 20                   # Chunks each retriever returns for a query
  reranking: false            # true to also rerank the top_k chunks with the cross-encoder, false not to
  rerank_top_k: 5             # Chunks kept after the cross-encoder reranks the top_k chunks
  n_top_setups: 3             # Best setups by retrieval eval, plain and reranked ranked together, that go on to the answer step

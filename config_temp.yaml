framework: "langchain" 
# 1. Ingestion
ingestion:
  dataset_size: 15
  dataset_name: pdfa-eng-wds
  input_path: data/pdfa-eng-wds/
  output_path: temp/
  document_type: pdf

# 2. Chunking
chunking:
  model_name: all-MiniLM-L6-v2
  chunk_types: [fixed, sentence, semantic]    # one or more of fixed, sentence, semantic
  min_chunk_size: 128
  max_chunk_size: 256
  fixed_chunk_overlap: 32
  semantic_threshold: 0.2

# 4. Indexing
indexing:
  index_types: [faiss_flatip, faiss_ivf, faiss_hnsw, bm25]   # one or more of faiss_flatip, faiss_ivf, faiss_hnsw, bm25
  ivf_nlist: 256
  hnsw_m: 32
  hnsw_ef_construction: 200
  bm25_k1: 1.5
  bm25_b: 0.75
  bm25_tokenizer: whitespace

# 5. Vector DB
vectordb:
  vectordb_types: [qdrant]    # one or more of qdrant
  qdrant_url: http://localhost:6333
  qdrant_batch_size: 256